version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Majors of the test and lint toolchains arrive in their groups below (their peer ranges
      # move together; a blanket ban left a half-updated, uninstallable set). Majors of what
      # sets the runtime or the language need a planned migration, not a bot PR.
      - dependency-name: electron
        update-types: ['version-update:semver-major']
      - dependency-name: better-sqlite3
        update-types: ['version-update:semver-major']
      - dependency-name: undici
        update-types: ['version-update:semver-major']
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: react-dom
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react-dom'
        update-types: ['version-update:semver-major']
      # Typings must match the oldest Node the app supports (`engines`: 22).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # eslint-plugin-import (latest 2.32) accepts ESLint up to 9: 10 fails npm ci with ERESOLVE.
      # Lift this once the plugin declares support for 10.
      - dependency-name: eslint
        versions: ['10.x']
      # 0.x: every minor is a breaking change, so the rule above does not catch it. esbuild only
      # bundles the preload script (Vite 8 has its own bundler): bump it by hand.
      - dependency-name: esbuild
        update-types: ['version-update:semver-minor']
    groups:
      # Peer ranges tie these together: one PR, or the install fails (ERESOLVE).
      test-toolchain:
        patterns:
          - vite
          - vitest
          - '@vitest/*'
          - '@vitejs/*'
          - esbuild
          - happy-dom
      lint-toolchain:
        patterns:
          - eslint
          - 'eslint-*'
          - '@typescript-eslint/*'
          - typescript
          - prettier
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
          - '@testing-library/*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
