name: Release

# Push a tag like v0.2.5 (the version in package.json must match) to build installers for
# macOS arm64 (dmg, zip), Windows x64 and arm64 (nsis, portable) and Linux x64 and arm64
# (AppImage, deb, rpm) and attach them to a draft GitHub release. See docs/RELEASING.en.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A tag must not release a commit whose CI failed or is still running.
  # A manual run (a dry run of the builds) skips this check.
  ci-green:
    name: CI is green on this commit
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Look up the CI run of the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs"
          ok=$(gh api "${url}?head_sha=${GITHUB_SHA}&event=push" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
          if [ "$ok" -lt 1 ]; then
            echo "::error::CI has not passed on ${GITHUB_SHA}. Wait, then re-run this workflow."
            exit 1
          fi

  build:
    name: Build (${{ matrix.os }}, ${{ matrix.arch }})
    needs: ci-green
    if: >-
      ${{ !cancelled() &&
      (needs.ci-green.result == 'success' || needs.ci-green.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04, arch: x64, script: dist:linux }
          - { os: ubuntu-26.04-arm, arch: arm64, script: dist:linux }
          - { os: macos-latest, arch: arm64, script: dist:mac }
          - { os: windows-latest, arch: x64, script: dist:win }
          - { os: windows-11-arm, arch: arm64, script: dist:win }
    env:
      # No certificate is used: do not look for a signing identity.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install rpm tooling (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Install dependencies
        shell: bash
        run: |
          # The registry and nodejs.org time out now and then: three tries before giving up.
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed (attempt $attempt)"; sleep 20
          done
          exit 1
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run build
      # The architecture comes from the matrix: each one is built on a runner of its own kind,
      # so the native module (better-sqlite3) is built, not cross-compiled.
      - run: npm run ${{ matrix.script }} -- --${{ matrix.arch }}
        shell: bash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm

  publish:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write # sign the build attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          merge-multiple: true
          path: release
      # The installers are not code-signed: a checksum list and a signed build attestation are
      # what a user can check a download against (see README, "Verify the download").
      - name: Checksums
        run: |
          (cd release && sha256sum -- * > ../SHA256SUMS.txt)
          mv SHA256SUMS.txt release/
          cat release/SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS.txt
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
